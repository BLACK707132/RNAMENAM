<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>BLACK STANT</title>
    <meta
      name="description"
      content="Аркадная игра про вилли и трюки на электросамокатах Kugoo G2, G2 Max, G2 Master, M2, Wish 01, F3 и Bootfor G77."
    />
    <meta property="og:title" content="BLACK STANT" />
    <meta
      property="og:description"
      content="Аркадная игра про вилли и трюки на электросамокатах Kugoo G2, G2 Max, G2 Master, M2, Wish 01, F3 и Bootfor G77."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#10151c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BLACK STANT" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <!-- Non-render-blocking fonts so slow/restricted mobile networks NEVER block game startup -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Manrope:wght@500;600;700;800&family=Rubik:wght@700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Manrope:wght@500;600;700;800&family=Rubik:wght@700;800;900&display=swap"
      />
    </noscript>
  </head>
  <body class="bg-[#10151c] text-white overflow-hidden select-none">
    <div id="root">
      <div
        id="bs-boot-splash"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          background: #10151c;
          color: #fff;
          font-family: system-ui, -apple-system, sans-serif;
          text-align: center;
          padding: 24px;
        "
      >
        <div style="font-size: 28px; font-weight: 900; letter-spacing: 0.06em;">
          BLACK <span style="color: #ff6a1a;">STANT</span>
        </div>
        <div id="bs-boot-status" style="font-size: 13px; color: rgba(255, 255, 255, 0.65);">
          Загрузка игры...
        </div>
        <button
          id="bs-boot-retry"
          type="button"
          style="
            display: none;
            margin-top: 6px;
            padding: 12px 22px;
            border-radius: 12px;
            border: 0;
            background: #ff6a1a;
            color: #fff;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
          "
        >
          Обновить и войти
        </button>
      </div>
    </div>
    <script>
      (function () {
        function clearCachesAndReload() {
          try {
            if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
            if ('caches' in window && caches.keys) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              });
            }
          } catch (e) {}
          setTimeout(function () {
            var url = window.location.pathname + '?reload=' + Date.now();
            window.location.replace(url);
          }, 220);
        }

        var btn = document.getElementById('bs-boot-retry');
        if (btn) btn.addEventListener('click', clearCachesAndReload);

        // Auto-recover immediately if an old cached index.html requested a deleted JS chunk
        window.addEventListener(
          'error',
          function (ev) {
            if (window.__BS_MOUNTED__) return;
            var target = ev && ev.target;
            if (target && target.tagName === 'SCRIPT') {
              try {
                if (!sessionStorage.getItem('bs_boot_recover_v2')) {
                  sessionStorage.setItem('bs_boot_recover_v2', '1');
                  clearCachesAndReload();
                }
              } catch (e) {}
            }
          },
          true
        );

        // If app failed to mount after 12s (stale SW cache or interrupted JS load), auto-recover once or show button
        setTimeout(function () {
          if (window.__BS_MOUNTED__) return;
          try {
            var tried = sessionStorage.getItem('bs_boot_recover_v2');
            if (!tried) {
              sessionStorage.setItem('bs_boot_recover_v2', '1');
              clearCachesAndReload();
              return;
            }
          } catch (e) {}
          var status = document.getElementById('bs-boot-status');
          if (status) status.textContent = 'Долгая загрузка. Нажми кнопку, чтобы очистить кэш и войти:';
          if (btn) btn.style.display = 'inline-block';
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
