<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Стант на самокате</title>
<style>
:root{--bg:#10151c;--pn:#1b222c;--tx:#fff;--ac:#ff6a1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{display:block;width:100%;height:100%}
#ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,13,18,.74);padding:16px;text-align:center;overflow:auto}
#ov h1,#ov h2,#ov p{margin:0}
button{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:13px 28px;font-size:20px;font-weight:700;font-family:inherit}
button:disabled{opacity:.4}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:520px;width:100%}
.cd{background:var(--pn);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.cd img{width:100%;height:110px;object-fit:contain;background:#fff;border-radius:10px}
.cd small{opacity:.7}.cd button{font-size:16px;padding:9px 14px}
#ctl{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:none;gap:14px;padding:0 14px}
.pb{flex:1;height:110px;border-radius:20px;font-size:26px;touch-action:none}
#gas{background:#2fb344}#brk{background:#d63b2f}
#mn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;display:none;padding:8px 14px;font-size:18px;background:rgba(0,0,0,.45)}
</style></head><body>
<canvas id="c"></canvas>
<button id="mn" onclick="pend=0;menu()">Меню</button>
<div id="ctl"><button class="pb" id="brk">ТОРМОЗ</button><button class="pb" id="gas">ГАЗ</button></div>
<div id="ov"></div>

function rs(){const d=devicePixelRatio||1;W=cv.width=cv.clientWidth*d;H=cv.height=cv.clientHeight*d;u=Math.min(W/430,H/800)}

function upd(dt){
 const s=cur();
 const tg=mode=="play"?260+s.pw*50+a*3:mode=="crash"?0:90;
 spd+=(tg-spd)*Math.min(1,dt*3);off+=spd*dt*u/2.2;
 if(mode=="play"){
  w+=((gas?55*s.pw:0)-(brk?95:0)-30*a/45)*dt;w-=w*.9*dt;a+=w*dt;
  if(a<0){a=0;w=0}

  if(a>=78)fall();
 }
